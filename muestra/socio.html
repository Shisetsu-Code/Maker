<head>

<!-- Lucide icons (ISC), as a sprite: <svg class="ic"><use href="#i-…"/></svg> -->

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">

  <symbol id="i-pointer" viewBox="0 0 24 24"><path d="m9 9 5 12 1.8-5.2L21 14Z"/><path d="M7.2 2.2 8 5.1"/><path d="m5.1 8-2.9-.8"/><path d="M14 4.1 12 6"/><path d="m6 12-1.9 2"/></symbol>
  <symbol id="i-bucket" viewBox="0 0 24 24"><path d="m19 11-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2c.8.8 2 .8 2.8 0L19 11Z"/><path d="m5 2 5 5"/><path d="M2 13h15"/><path d="M22 20a2 2 0 1 1-4 0c0-1.6 1.7-2.4 2-4 .3 1.6 2 2.4 2 4Z"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></symbol>
  <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></symbol>
  <symbol id="i-type" viewBox="0 0 24 24"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" x2="15" y1="20" y2="20"/><line x1="12" x2="12" y1="4" y2="20"/></symbol>
  <symbol id="i-text" viewBox="0 0 24 24"><path d="M15 12H3"/><path d="M17 18H3"/><path d="M21 6H3"/></symbol>
  <symbol id="i-chev-r" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="i-chev-l" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="i-chev-u" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></symbol>
  <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></symbol>
  <symbol id="i-paste" viewBox="0 0 24 24"><path d="M15 2H9a1 1 0 0 0-1 1v2c0 .6.4 1 1 1h6c.6 0 1-.4 1-1V3c0-.6-.4-1-1-1Z"/><path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2M16 4h2a2 2 0 0 1 2 2v2M11 14h10"/><path d="m17 10 4 4-4 4"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></symbol>
  <symbol id="i-loader" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></symbol>
  <symbol id="i-pipette" viewBox="0 0 24 24"><path d="m2 22 1-1h3l9-9"/><path d="M3 21v-3l9-9"/><path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3l.4.4Z"/></symbol>
  <symbol id="i-monitor" viewBox="0 0 24 24"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></symbol>

  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></symbol>
  <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></symbol>
  <symbol id="i-shrink" viewBox="0 0 24 24"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></symbol>
</svg>

<div class="app" id="app" data-vista="lobby" data-disp="compu">
  <header class="barra">
    <div class="barra-marca">
      <span class="barra-nombre" id="barra-nombre">RushyBet</span>
      <span class="chip-demo">Demo</span>
    </div>

    <div class="barra-pastillas">
      <div class="seg seg-barra" id="seg-vista" role="radiogroup" aria-label="Qué pantalla ver">
        <span class="seg-pastilla" aria-hidden="true"></span>
        <button type="button" class="tocable" role="radio" data-valor="lobby" aria-checked="true">Lobby</button>
        <button type="button" class="tocable" role="radio" data-valor="panel" aria-checked="false">Panel</button>
      </div>
      <div class="seg seg-barra" id="seg-disp" role="radiogroup" aria-label="En qué equipo verlo">
        <span class="seg-pastilla" aria-hidden="true"></span>
        <button type="button" class="tocable" role="radio" data-valor="compu" aria-checked="true"><svg class="ic ic-seg" aria-hidden="true"><use href="#i-monitor"/></svg>Compu</button>
        <button type="button" class="tocable" role="radio" data-valor="celular" aria-checked="false"><svg class="ic ic-seg" aria-hidden="true"><use href="#i-phone"/></svg>Celular</button>
      </div>
      <div class="seg seg-barra" id="seg-plantilla" role="radiogroup" aria-label="Plantilla del lobby" data-solo="lobby">
        <span class="seg-pastilla" aria-hidden="true"></span>
        <button type="button" class="tocable" role="radio" data-valor="clasica" aria-checked="true">Rushybet</button>
        <button type="button" class="tocable" role="radio" data-valor="azul" aria-checked="false">RushyClub azul</button>
        <button type="button" class="tocable" role="radio" data-valor="blaze" aria-checked="false">BlazeBet</button>
        <button type="button" class="tocable" role="radio" data-valor="brasa" aria-checked="false">Brasa</button>
      </div>
    </div>

    <div class="barra-acciones">
      <div class="ancla">
        <button type="button" class="btn btn-barra tocable" id="btn-restablecer" aria-label="Restablecer">
          <svg class="ic" aria-hidden="true"><use href="#i-reset"/></svg><span class="btn-tx">Restablecer</span>
        </button>
        <div class="burbuja" id="burbuja-restablecer" role="status" hidden>
          <span class="burbuja-tx">Volvió todo al original.</span>
          <button type="button" class="btn btn-chico tocable" id="btn-deshacer">Deshacer</button>
          <span class="burbuja-tiempo" aria-hidden="true"></span>
        </div>
      </div>
      <div class="ancla">
        <button type="button" class="btn btn-barra btn-claro tocable" id="btn-link" aria-label="Copiar link">
          <svg class="ic" aria-hidden="true"><use href="#i-link"/></svg><span class="btn-tx">Copiar link</span>
        </button>
        <div class="burbuja" id="burbuja-link" role="status" hidden>
          <span class="burbuja-tx" id="burbuja-link-tx">Link copiado.</span>
          <label class="burbuja-campo" id="burbuja-link-campo" hidden>
            <span class="visualmente-oculto">Link para copiar</span>
            <input id="link-manual" class="campo mono" type="text" readonly>
          </label>
          <span class="burbuja-nota">El logo no se incluye en el link.</span>
        </div>
      </div>
    </div>
  </header>

  <main class="escenario" id="escenario">
    <div class="escena" id="escena" aria-live="off"></div>
    <div class="escena-estado" id="escena-estado" role="status" hidden></div>
    <aside class="diag" id="diag" hidden aria-label="Diagnóstico del visor"></aside>
  </main>

  <aside class="cajon" id="cajon" aria-label="Opciones de la marca" data-abierto="false">
    <button type="button" class="hoja-cabeza tocable" id="hoja-cabeza" aria-expanded="false" aria-controls="cajon-cuerpo">
      <span class="hoja-agarre" aria-hidden="true"></span>
      <span class="hoja-titulo">¿Qué querés cambiar?</span>
      <span class="hoja-muestra" id="hoja-muestra" aria-hidden="true"></span>
      <svg class="ic hoja-chev" aria-hidden="true"><use href="#i-chev-u"/></svg>
    </button>

    <div class="cajon-cuerpo" id="cajon-cuerpo">
      <div class="pistas" id="pistas" data-en="lista">
        <!-- LIST -->
        <section class="pista pista-lista" id="pista-lista" aria-labelledby="titulo-lista">
          <h2 class="cajon-titulo" id="titulo-lista">¿Qué querés cambiar?</h2>
          <div class="filas" id="filas">
            <button type="button" class="fila tocable" data-abrir="p" style="--i:0">
              <svg class="ic fila-ic" aria-hidden="true"><use href="#i-palette"/></svg>
              <span class="fila-tx"><span class="fila-rot">Color de la marca</span><span class="fila-baj">Barras, acentos, EN VIVO, montos y el panel</span></span>
              <span class="fila-valor" data-valor="p"></span>
              <svg class="ic fila-chev" aria-hidden="true"><use href="#i-chev-r"/></svg>
            </button>
            <button type="button" class="fila tocable" data-abrir="b" style="--i:1">
              <svg class="ic fila-ic" aria-hidden="true"><use href="#i-pointer"/></svg>
              <span class="fila-tx"><span class="fila-rot">Botones</span><span class="fila-baj">Cargar fichas, Registrarte, chat y botones del panel</span></span>
              <span class="fila-valor" data-valor="b"></span>
              <svg class="ic fila-chev" aria-hidden="true"><use href="#i-chev-r"/></svg>
            </button>
            <button type="button" class="fila tocable" data-abrir="f" style="--i:2">
              <svg class="ic fila-ic" aria-hidden="true"><use href="#i-bucket"/></svg>
              <span class="fila-tx"><span class="fila-rot">Fondo</span><span class="fila-baj">El fondo de todas las pantallas</span></span>
              <span class="fila-valor" data-valor="f"></span>
              <svg class="ic fila-chev" aria-hidden="true"><use href="#i-chev-r"/></svg>
            </button>
            <button type="button" class="fila tocable" data-abrir="t" style="--i:3">
              <svg class="ic fila-ic" aria-hidden="true"><use href="#i-grid"/></svg>
              <span class="fila-tx"><span class="fila-rot">Tarjetas</span><span class="fila-baj">Puertas de Vivo, Slots y Deportes, promos y ganadores</span></span>
              <span class="fila-valor" data-valor="t"></span>
              <svg class="ic fila-chev" aria-hidden="true"><use href="#i-chev-r"/></svg>
            </button>
            <button type="button" class="fila tocable" data-abrir="s" style="--i:4">
              <svg class="ic fila-ic" aria-hidden="true"><use href="#i-sparkles"/></svg>
              <span class="fila-tx"><span class="fila-rot">Brillos</span><span class="fila-baj">Luces, neón de la carga, multiplicadores, borde metálico</span></span>
              <span class="fila-valor" data-valor="s"></span>
              <svg class="ic fila-chev" aria-hidden="true"><use href="#i-chev-r"/></svg>
            </button>
            <button type="button" class="fila tocable" data-abrir="im" style="--i:5">
              <svg class="ic fila-ic" aria-hidden="true"><use href="#i-image"/></svg>
              <span class="fila-tx"><span class="fila-rot">Imágenes</span><span class="fila-baj">Fichas, ruleta, slots, deportes y el banner</span></span>
              <span class="fila-valor" data-valor="im"></span>
              <svg class="ic fila-chev" aria-hidden="true"><use href="#i-chev-r"/></svg>
            </button>
            <button type="button" class="fila tocable" data-abrir="n" style="--i:6">
              <svg class="ic fila-ic" aria-hidden="true"><use href="#i-type"/></svg>
              <span class="fila-tx"><span class="fila-rot">Logo y nombre</span><span class="fila-baj">El logo del lobby, las hojas de carga y el panel</span></span>
              <span class="fila-valor" data-valor="n"></span>
              <svg class="ic fila-chev" aria-hidden="true"><use href="#i-chev-r"/></svg>
            </button>
            <button type="button" class="fila tocable" data-abrir="x" data-solo="panel" style="--i:7">
              <svg class="ic fila-ic" aria-hidden="true"><use href="#i-text"/></svg>
              <span class="fila-tx"><span class="fila-rot">Textos del panel</span><span class="fila-baj">Títulos, datos y rótulos del panel</span></span>
              <span class="fila-valor" data-valor="x"></span>
              <svg class="ic fila-chev" aria-hidden="true"><use href="#i-chev-r"/></svg>
            </button>
            <p class="fila-nota" data-solo="lobby" style="--i:7">
              <svg class="ic" aria-hidden="true"><use href="#i-text"/></svg>
              <span>En el lobby los textos quedan blancos.</span>
            </p>
          </div>

          <section class="codigo" aria-labelledby="titulo-codigo">
            <h3 class="codigo-titulo" id="titulo-codigo">Código de marca</h3>
            <p class="codigo-baj">Guarda colores, nombre e imágenes (no el logo). Pegalo acá para recuperar una marca.</p>
            <div class="codigo-fila">
              <output class="codigo-caja mono" id="codigo-actual" for="btn-copiar-codigo"></output>
              <button type="button" class="btn btn-icono tocable" id="btn-copiar-codigo" aria-label="Copiar código de marca">
                <svg class="ic" aria-hidden="true"><use href="#i-copy"/></svg>
              </button>
            </div>
            <p class="aviso" id="aviso-copiar-codigo" role="status"></p>
            <form class="codigo-fila" id="form-pegar" autocomplete="off">
              <label class="visualmente-oculto" for="pegar-codigo">Pegar código de marca</label>
              <input class="campo mono" id="pegar-codigo" name="codigo" type="text" placeholder="Pegar código" spellcheck="false">
              <button type="submit" class="btn btn-chico tocable" id="btn-aplicar-codigo">
                <svg class="ic" aria-hidden="true"><use href="#i-paste"/></svg>Aplicar
              </button>
            </form>
            <p class="aviso" id="aviso-pegar-codigo" role="status"></p>
          </section>
        </section>

        <!-- DETAIL (filled by control.ts: one section per knob, one visible at a time) -->
        <section class="pista pista-detalle" id="pista-detalle" aria-live="off"></section>
      </div>
    </div>
  </aside>
</div>

<noscript><p class="sin-js">Este probador necesita JavaScript para mostrar la vista previa.</p></noscript>
<script src="socio.js"></script>
</body>
</html>
