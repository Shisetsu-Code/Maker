name: Maker original - localhost
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original code fidelity
        run: node --test tests/original-contract.test.cjs
      - name: Unpack captured static images
        run: python scripts/unpack_assets.py
      - name: Install headless browser
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps "$BROWSER"
      - name: Run browser against loopback only
        env:
          BROWSER: ${{ matrix.browser }}
        run: python tests/browser.py
      - name: Store screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maker-original-${{ matrix.browser }}
          path: artifacts/${{ matrix.browser }}/
          retention-days: 7
          if-no-files-found: warn