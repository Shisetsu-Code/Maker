name: Maker checks
on:
  push:
    branches: [main, maker-initial]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: maker-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and unit tests
        run: |
          for file in src/*.js scripts/*.mjs; do node --check "$file"; done
          npm test
      - name: Build static site
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependency
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Browser acceptance tests
        run: python tests/browser.py
      - name: Screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maker-browser-evidence
          path: artifacts/
          retention-days: 7
      - name: Downloadable website
        uses: actions/upload-artifact@v4
        with:
          name: maker-static-site
          path: dist/
          retention-days: 7
