name: Maker checks
on:
  push:
    branches: [main, maker-initial, maker-functional-qa]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: maker-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    name: Unit tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and unit tests
        run: |
          for file in src/*.js scripts/*.mjs; do node --check "$file"; done
          npm test
      - name: Build static site without deployment
        run: npm run build
      - name: Compiled site for localhost tests
        uses: actions/upload-artifact@v4
        with:
          name: maker-static-site
          path: dist/
          retention-days: 7
          if-no-files-found: error
  browser:
    name: Localhost acceptance (${{ matrix.browser }})
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download the exact build under test
        uses: actions/download-artifact@v4
        with:
          name: maker-static-site
          path: dist/
      - name: Install browser test dependency
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps "$BROWSER"
      - name: Immediate reload persistence regression
        env:
          BROWSER: ${{ matrix.browser }}
          PYTHONUNBUFFERED: '1'
        run: python tests/autosave.py
      - name: Exercise compiled website at 127.0.0.1 only
        env:
          BROWSER: ${{ matrix.browser }}
          PYTHONUNBUFFERED: '1'
        run: python tests/localhost.py
      - name: Extended customer journeys on localhost
        env:
          BROWSER: ${{ matrix.browser }}
          PYTHONUNBUFFERED: '1'
        run: python tests/functional.py
      - name: Screenshots, traces and JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maker-browser-evidence-${{ matrix.browser }}
          path: artifacts/${{ matrix.browser }}/
          retention-days: 7
          if-no-files-found: warn
