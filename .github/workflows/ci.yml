name: Verify Maker
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-privacy.txt
      - run: python -m pip install -r requirements-privacy.txt
      - run: npm run test:privacy
      - run: npm test
      - run: npx wrangler deploy --dry-run
